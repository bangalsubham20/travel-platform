<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f766e"/>
      <stop offset="50%" stop-color="#0891b2"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="mountainGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0f2fe" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  
  <!-- Outer Subtle Ring -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#ffffff" stroke-width="8" stroke-opacity="0.2" />

  <!-- Rising Sun -->
  <circle cx="256" cy="200" r="75" fill="url(#sunGrad)" filter="url(#glow)" />

  <!-- Mountain Peaks (Travel & Soul) -->
  <path d="M 90 380 L 215 200 L 295 320 L 355 235 L 422 380 Z" fill="url(#mountainGrad)" />

  <!-- Compass Star / North Sparkle -->
  <path d="M 256 95 L 268 140 L 313 152 L 268 164 L 256 209 L 244 164 L 199 152 L 244 140 Z" fill="#ffffff" />
</svg>
